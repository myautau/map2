<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Карта экосистемы — Газпром нефть</title>
  <link rel="stylesheet" href="styles.css?v=31" />
</head>
<body>
  <main class="app-shell" aria-label="Карта экосистемы Газпром нефти">
    <aside class="sidebar" aria-label="Иерархия компаний и направлений">
      <div class="brand-search">
        <div class="brand-search-field">
          <svg aria-hidden="true" viewBox="0 0 16 16"><path d="m13.8 13.8-3.1-3.1m1.42-4.16a5.58 5.58 0 1 1-11.16 0 5.58 5.58 0 0 1 11.16 0Z" /></svg>
          <input id="brand-search-input" type="search" placeholder="Поиск по брендам" aria-label="Поиск по брендам" autocomplete="off" aria-autocomplete="list" aria-controls="brand-search-results" />
          <button id="brand-search-clear" class="brand-search-clear" type="button" aria-label="Очистить поиск" hidden><img src="assets/close.svg" alt="" /></button>
        </div>
        <div id="brand-search-results" class="brand-search-results" role="listbox" hidden></div>
      </div>
      <div id="tree" class="tree"></div>
    </aside>
    <section class="graph-panel" aria-label="Граф связей">
      <svg id="graph" viewBox="0 0 1162 960" role="img" aria-label="Карта связей компаний и функций"></svg>
      <div id="tooltip" class="tooltip" role="status"></div>
      <label class="semantic-zoom-control">
        <input id="semantic-zoom-toggle" type="checkbox" />
        <span class="semantic-zoom-checkbox" aria-hidden="true"><img src="assets/checkbox-checked.svg" alt="" /></span>
        <span>Скрывать бренды при отдалении</span>
      </label>
      <div class="map-controls" aria-label="Масштаб карты">
        <button id="zoom-in" type="button" aria-label="Увеличить масштаб"><img src="assets/zoom-plus.svg" alt="" /></button>
        <button id="zoom-out" type="button" aria-label="Уменьшить масштаб"><span class="zoom-minus"></span></button>
      </div>
      <aside id="detail-panel" class="detail-panel" aria-hidden="true" aria-label="Карточка бренда">
        <div class="detail-scroll">
          <div class="detail-heading">
            <h2 id="detail-title" class="detail-title"></h2>
            <button id="detail-close" class="detail-close" type="button" aria-label="Закрыть карточку"><img src="assets/close.svg" alt="" /></button>
          </div>
          <div class="detail-logo-frame">
            <img id="detail-logo-image" class="detail-logo-image" alt="" />
            <div id="detail-logo-text" class="detail-logo-text"></div>
          </div>
          <div class="detail-description-wrap">
            <p id="detail-description" class="detail-description"></p>
            <button id="detail-expand" class="detail-expand" type="button">Показать все</button>
          </div>
          <div class="detail-divider" aria-hidden="true"></div>
          <div class="detail-fields">
            <div class="detail-field"><span>Материнский бренд</span><strong id="detail-parent"></strong></div>
            <div id="detail-children-field" class="detail-field"><span>Дочерние бренды</span><strong id="detail-children" class="detail-link-list"></strong><button id="detail-children-expand" class="detail-expand" type="button">Показать все</button></div>
            <div class="detail-field"><span>Товарные знаки</span><strong id="detail-trademarks"></strong></div>
            <div class="detail-field"><span>Категория объекта</span><strong id="detail-category"></strong></div>
            <div class="detail-field"><span>Аудитория</span><strong id="detail-audience"></strong></div>
            <div class="detail-field detail-eol-field"><span>ЕОЛ</span><strong id="detail-eol"></strong></div>
            <div class="detail-field"><span>Контакты</span><strong id="detail-contacts" class="detail-link-value"></strong></div>
          </div>
        </div>
        <div class="detail-footer"><button type="button">Подробнее</button></div>
      </aside>
    </section>
  </main>
  <script src="app.js?v=40"></script>
</body>
</html>
